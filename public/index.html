<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weinregal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="logo">🍷</span>
      <h1>Mein Weinregal</h1>
      <button id="btn-add" class="btn btn-primary">+ Wein hinzufügen</button>
    </div>
  </header>

  <main class="app-main">
    <!-- Search & filter bar -->
    <section class="toolbar">
      <input id="search" type="search" placeholder="Suchen …" autocomplete="off" />
      <div class="filter-buttons">
        <button class="filter-btn active" data-type="all">Alle</button>
        <button class="filter-btn" data-type="Rotwein">🍷 Rot</button>
        <button class="filter-btn" data-type="Weißwein">🥂 Weiß</button>
        <button class="filter-btn" data-type="Rosé">🌸 Rosé</button>
        <button class="filter-btn" data-type="Sekt">✨ Sekt</button>
        <button class="filter-btn" data-type="Dessert">🍯 Dessert</button>
      </div>
    </section>

    <!-- Stats bar -->
    <section class="stats-bar" id="stats-bar">
      <span id="stat-total">0 Flaschen</span>
      <span id="stat-types"></span>
    </section>

    <!-- Wine grid -->
    <section class="wine-grid" id="wine-grid">
      <div class="empty-state" id="empty-state">
        <span class="empty-icon">🍾</span>
        <p>Noch keine Weine im Regal.</p>
        <button class="btn btn-primary" id="btn-add-empty">Ersten Wein eintragen</button>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Wein hinzufügen</h2>
        <button class="modal-close" id="modal-close" aria-label="Schließen">✕</button>
      </div>
      <form id="wine-form" novalidate>
        <input type="hidden" id="wine-id" />

        <div class="form-row">
          <div class="form-group required">
            <label for="f-name">Name</label>
            <input id="f-name" type="text" required placeholder="z. B. Château Margaux" />
          </div>
          <div class="form-group">
            <label for="f-year">Jahrgang</label>
            <input id="f-year" type="number" min="1800" max="2099" placeholder="z. B. 2020" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-type">Typ</label>
            <select id="f-type">
              <option value="Rotwein">🍷 Rotwein</option>
              <option value="Weißwein">🥂 Weißwein</option>
              <option value="Rosé">🌸 Rosé</option>
              <option value="Sekt">✨ Sekt</option>
              <option value="Dessert">🍯 Dessertwein</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-grape">Rebsorte</label>
            <input id="f-grape" type="text" placeholder="z. B. Riesling" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-region">Region</label>
            <input id="f-region" type="text" placeholder="z. B. Mosel" />
          </div>
          <div class="form-group">
            <label for="f-country">Land</label>
            <input id="f-country" type="text" placeholder="z. B. Deutschland" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-quantity">Anzahl</label>
            <input id="f-quantity" type="number" min="0" value="1" />
          </div>
          <div class="form-group">
            <label for="f-price">Preis (€)</label>
            <input id="f-price" type="number" min="0" step="0.01" placeholder="z. B. 14.90" />
          </div>
        </div>

        <div class="form-group">
          <label>Bewertung</label>
          <div class="star-rating" id="star-rating" role="radiogroup" aria-label="Bewertung">
            <button type="button" class="star" data-value="1" aria-label="1 Stern">★</button>
            <button type="button" class="star" data-value="2" aria-label="2 Sterne">★</button>
            <button type="button" class="star" data-value="3" aria-label="3 Sterne">★</button>
            <button type="button" class="star" data-value="4" aria-label="4 Sterne">★</button>
            <button type="button" class="star" data-value="5" aria-label="5 Sterne">★</button>
          </div>
          <input type="hidden" id="f-rating" value="" />
        </div>

        <div class="form-group">
          <label for="f-notes">Notizen</label>
          <textarea id="f-notes" rows="3" placeholder="Geschmack, Anlass, …"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Abbrechen</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div class="modal-overlay" id="delete-overlay" hidden>
    <div class="modal modal--sm" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2>Wein löschen?</h2>
        <button class="modal-close" id="delete-cancel-x">✕</button>
      </div>
      <p id="delete-msg" style="padding: 0 1.5rem 1rem"></p>
      <div class="form-actions" style="padding: 0 1.5rem 1.5rem">
        <button class="btn btn-secondary" id="delete-cancel">Abbrechen</button>
        <button class="btn btn-danger" id="delete-confirm">Löschen</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
